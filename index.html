<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Việc Cần Làm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { font-family: 'Inter', system-ui, sans-serif; }
    body { -webkit-font-smoothing: antialiased; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(40px); height: 0; padding: 0; margin: 0; } }
    .task-enter { animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .task-exit { animation: fadeOut 0.3s ease forwards; overflow: hidden; }
    .check-circle svg { transition: all 0.2s ease; }
    .check-circle:hover svg { transform: scale(1.12); }
    .filter-btn { transition: all 0.2s ease; }
    .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(203 213 225); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(148 163 184); }
    .line-through-anim { transition: opacity 0.25s ease; }
    input[type="checkbox"].custom { appearance: none; }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body class="h-full bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-50 text-slate-800">
  <div class="min-h-full flex items-start justify-center px-4 py-8 sm:py-14">
    <div class="w-full max-w-xl">

      <!-- Header -->
      <header class="mb-8 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 shadow-lg shadow-blue-500/30 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Việc Cần Làm</h1>
        <p class="mt-2 text-slate-500 text-sm">Ghi lại, hoàn thành, và gạt bỏ âu lo.</p>
      </header>

      <!-- Card -->
      <div class="glass bg-white/80 rounded-3xl shadow-xl shadow-slate-200/60 ring-1 ring-slate-200/60 p-6 sm:p-7">

        <!-- Add form -->
        <form id="task-form" class="flex flex-col sm:flex-row gap-2.5">
          <input
            id="task-input"
            type="text"
            placeholder="Thêm việc mới..."
            autocomplete="off"
            maxlength="120"
            class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          />
          <div class="flex gap-2.5">
            <input
              id="date-input"
              type="date"
              class="w-[150px] px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            />
            <button type="submit"
              class="shrink-0 inline-flex items-center gap-1.5 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-md shadow-blue-600/25 hover:bg-blue-700 active:scale-[0.97] transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              <span class="hidden sm:inline">Thêm</span>
            </button>
          </div>
        </form>

        <!-- Filters + counter -->
        <div class="flex items-center justify-between gap-2 mt-6 mb-4">
          <div class="inline-flex p-1 rounded-xl bg-slate-100">
            <button data-filter="all"    class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-600">Tất cả</button>
            <button data-filter="active" class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-600">Chưa xong</button>
            <button data-filter="done"   class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-600">Đã xong</button>
          </div>
          <span id="counter" class="text-xs sm:text-sm text-slate-400 font-medium whitespace-nowrap"></span>
        </div>

        <!-- List -->
        <ul id="task-list" class="space-y-2 max-h-[52vh] overflow-y-auto pr-1"></ul>

        <!-- Empty state -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
          <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
          <p id="empty-text" class="text-slate-400 text-sm">Chưa có việc nào. Thêm một việc để bắt đầu!</p>
        </div>

        <!-- Footer actions -->
        <div id="footer-actions" class="hidden flex items-center justify-between gap-2 mt-5 pt-4 border-t border-slate-100">
          <span id="remaining" class="text-sm text-slate-500"></span>
          <button id="clear-done" class="text-sm font-medium text-rose-500 hover:text-rose-600 hover:underline transition">Xóa các việc đã xong</button>
        </div>
      </div>

      <p class="mt-6 text-center text-xs text-slate-400">Dữ liệu được lưu tự động trên trình duyệt của bạn.</p>
    </div>
  </div>

  <script>
  (() => {
    const STORAGE_KEY = 'todo.tasks.v1';
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const dateInput = document.getElementById('date-input');
    const list = document.getElementById('task-list');
    const counter = document.getElementById('counter');
    const emptyState = document.getElementById('empty-state');
    const emptyText = document.getElementById('empty-text');
    const footerActions = document.getElementById('footer-actions');
    const remaining = document.getElementById('remaining');
    const clearDone = document.getElementById('clear-done');
    const filterBtns = document.querySelectorAll('[data-filter]');

    let tasks = [];
    let filter = 'all';

    const MONTHS = ['thg 1','thg 2','thg 3','thg 4','thg 5','thg 6','thg 7','thg 8','thg 9','thg 10','thg 11','thg 12'];

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      return `${d} ${MONTHS[m-1]}, ${y}`;
    }

    function dateStatus(dateStr, done) {
      if (!dateStr) return 'none';
      if (done) return 'done';
      const today = todayStr();
      if (dateStr < today) return 'overdue';
      if (dateStr === today) return 'today';
      return 'future';
    }

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
      } catch { tasks = []; }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function render() {
      const shown = tasks.filter(t =>
        filter === 'all' ? true : filter === 'active' ? !t.done : t.done
      ).sort((a, b) => {
        // Undone first, then by date
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      list.innerHTML = '';
      const total = tasks.length;
      const doneCount = tasks.filter(t => t.done).length;
      const activeCount = total - doneCount;

      counter.textContent = total ? `${doneCount}/${total} đã xong` : '';

      if (shown.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        emptyText.textContent = total === 0
          ? 'Chưa có việc nào. Thêm một việc để bắt đầu!'
          : filter === 'active' ? 'Không còn việc nào chưa xong. Tuyệt vời!'
          : 'Chưa có việc nào được đánh dấu xong.';
        list.classList.add('hidden');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
        list.classList.remove('hidden');
        for (const t of shown) list.appendChild(el(t));
      }

      if (total > 0) {
        footerActions.classList.remove('hidden');
        footerActions.classList.add('flex');
        remaining.textContent = `${activeCount} việc chưa xong`;
        clearDone.style.visibility = doneCount > 0 ? 'visible' : 'hidden';
      } else {
        footerActions.classList.add('hidden');
        footerActions.classList.remove('flex');
      }

      filterBtns.forEach(b => {
        const active = b.dataset.filter === filter;
        b.classList.toggle('bg-white', active);
        b.classList.toggle('shadow-sm', active);
        b.classList.toggle('text-blue-600', active);
        b.classList.toggle('text-slate-600', !active);
      });
    }

    function el(t) {
      const li = document.createElement('li');
      li.className = 'task-enter group flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-white ring-1 ring-slate-100 hover:ring-slate-200 hover:shadow-sm transition';
      li.dataset.id = t.id;

      const toggle = document.createElement('button');
      toggle.className = 'check-circle shrink-0';
      toggle.setAttribute('aria-label', t.done ? 'Đánh dấu chưa xong' : 'Đánh dấu đã xong');
      toggle.innerHTML = t.done
        ? `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.12" stroke="currentColor"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 12l2.5 2.5L16 9"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-300 hover:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`;
      toggle.addEventListener('click', () => toggleTask(t.id));

      const wrap = document.createElement('div');
      wrap.className = 'flex-1 min-w-0';

      const span = document.createElement('span');
      span.className = 'block text-[15px] leading-snug break-words ' + (t.done ? 'line-through text-slate-400 line-through-anim' : 'text-slate-700');
      span.textContent = t.text;
      wrap.appendChild(span);

      if (t.dueDate) {
        const ds = dateStatus(t.dueDate, t.done);
        const dateBadge = document.createElement('span');
        const colors = {
          overdue: 'text-rose-500 bg-rose-50',
          today:   'text-amber-600 bg-amber-50',
          future:  'text-slate-400 bg-slate-50',
          done:    'text-slate-400 bg-slate-50',
          none:    'text-slate-400 bg-slate-50',
        };
        dateBadge.className = 'inline-flex items-center gap-1 mt-1 px-2 py-0.5 rounded-md text-[11px] font-medium ' + colors[ds];
        const icons = {
          overdue: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',
          today:   '<path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16v4m-2-2h4M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',
          future:  '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
          done:    '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
          none:    '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
        };
        dateBadge.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${icons[ds]}</svg>${formatDate(t.dueDate)}`;
        if (ds === 'overdue') dateBadge.innerHTML += ' · quá hạn';
        if (ds === 'today')   dateBadge.innerHTML += ' · hôm nay';
        wrap.appendChild(dateBadge);
      }

      const del = document.createElement('button');
      del.className = 'shrink-0 opacity-0 group-hover:opacity-100 focus:opacity-100 text-slate-300 hover:text-rose-500 transition';
      del.setAttribute('aria-label', 'Xóa việc');
      del.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
      del.addEventListener('click', () => removeTask(t.id));

      li.append(toggle, wrap, del);
      return li;
    }

    function addTask(text, dueDate) {
      text = text.trim();
      if (!text) return;
      tasks.unshift({ id: uid(), text, done: false, createdAt: Date.now(), dueDate: dueDate || null });
      save();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    }

    function removeTask(id) {
      const li = list.querySelector(`[data-id="${id}"]`);
      if (li) {
        li.classList.add('task-exit');
        li.addEventListener('animationend', () => {
          tasks = tasks.filter(t => t.id !== id);
          save();
          render();
        }, { once: true });
      } else {
        tasks = tasks.filter(t => t.id !== id);
        save();
        render();
      }
    }

    function clearDoneTasks() {
      const removing = tasks.filter(t => t.done);
      if (!removing.length) return;
      removing.forEach(t => {
        const li = list.querySelector(`[data-id="${t.id}"]`);
        if (li) li.classList.add('task-exit');
      });
      setTimeout(() => {
        tasks = tasks.filter(t => !t.done);
        save();
        render();
      }, 300);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      addTask(input.value, dateInput.value);
      input.value = '';
      dateInput.value = '';
      input.focus();
    });

    filterBtns.forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; render(); }));
    clearDone.addEventListener('click', clearDoneTasks);

    load();
    render();
    input.focus();
  })();
  </script>
</body>
</html>
